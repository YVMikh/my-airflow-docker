version: 2

models:
  - name: stg_almaty_pm25
    description: >
      Hourly PM2.5 statistics per geographical cluster (maximum, minimum, mean and median over
      the readings of the cluster's stations within the hour). Grain: measured_at and cluster_id.
      Rows with missing or physically impossible values are dropped before aggregation.
    tests:
      - unique_combination:
          arguments:
            columns: [measured_at, cluster_id]
      - statistics_consistent:
          arguments:
            prefix: 'pm25'   # quoted: an unquoted no is a boolean in YAML
    columns:
      - name: measured_at
        description: Start of the hour, UTC.
        tests:
          - not_null
          - not_in_future
      - name: cluster_id
        tests:
          - not_null
      - name: cluster_name
      - name: pm25_max
        tests:
          - not_null
          - value_not_below:
              arguments:
                min_value: 0
              config:
                severity: warn
      - name: pm25_min
      - name: pm25_avg
      - name: pm25_median
      - name: pm25_station_count
        description: Number of distinct stations that contributed to the hour (1 means min, mean and max coincide).
        tests:
          - not_null
          - value_not_below:
              arguments:
                min_value: 1
      - name: pm25_reading_count

