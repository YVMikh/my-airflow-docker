name: 'climate_data_dbt'
version: '1.0.0'

# Profile (connection) used by this project, see profiles.yml
profile: 'climate_data_dbt'

# Where dbt looks for different types of files
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Project-wide variables
vars:
  # Weather model used by the intermediate layer. Raw and staging keep all loaded models;
  # the choice is made here, in one place (see "Weather Source Selection" in the README).
  primary_weather_model: 'ecmwf_ifs'

# Layer configuration. A custom +schema is appended to the target schema by dbt's default
# behaviour: with target schema dbt_dev the layers are built in dbt_dev_staging,
# dbt_dev_intermediate and dbt_dev_marts.
models:
  climate_data_dbt:
    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: table
      +schema: intermediate

    marts:
      +materialized: table
      +schema: marts