name: Full Data & Python Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check-all:
    runs-on: ubuntu-latest

    steps:
    - name: Скачать код
      uses: actions/checkout@v4

    - name: Установить Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Установить зависимости и линтеры
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest sqlfluff sqlfluff-templater-dbt
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 1. Python: синтаксис и строгий линтер
    - name: Python Syntax & Lint (flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Python Code Quality
      continue-on-error: true
      run: |
        flake8 . --count --statistics


    # 2. Python: юнит-тесты
    - name: Python Tests (pytest)
      run: pytest || [ $? -eq 5 ]

    # 3. Docker Compose: проверка валидности конфигурации
    - name: Validate Docker Compose
      env:
        AIRFLOW_DB_PASSWORD: ci_airflow_password
        AIRFLOW_FERNET_KEY: ci_dummy_fernet_key
        AIRFLOW_WEBSERVER_SECRET_KEY: ci_webserver_secret
        WAREHOUSE_DB_PASSWORD: ci_warehouse_password
        PGADMIN_EMAIL: ci@example.com
        PGADMIN_PASSWORD: ci_pgadmin_password
        AIRFLOW_ADMIN_PASSWORD: ci_admin_password
      run: docker compose -f docker-compose.yaml config --quiet

    # 4. SQL: проверка стиля и синтаксиса SQL-файлов
    - name: SQL Lint (SQLFluff)
      working-directory: ./climate_data_dbt
      run: |
        sqlfluff lint models/ 

    # 5. dbt: компиляция моделей без подключения к боевой БД
    - name: dbt Parse
      working-directory: ./climate_data_dbt
      run: |
        mkdir -p /tmp/dbt-ci

        cat > /tmp/dbt-ci/profiles.yml <<'EOF'
        climate_data_dbt:
          target: ci
          outputs:
            ci:
              type: postgres
              host: localhost
              port: 5432
              user: ci_user
              password: ci_password
              dbname: ci_database
              schema: ci_schema
              threads: 1
        EOF

        dbt deps
        dbt parse --profiles-dir /tmp/dbt-ci
